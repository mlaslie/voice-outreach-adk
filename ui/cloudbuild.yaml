# Build the dashboard image with the NEXT_PUBLIC_* branding values baked in.
#
# `gcloud builds submit --tag` cannot pass Docker build args, and --tag and
# --config are mutually exclusive, hence this file. Only branding is a build
# arg; the backend URL is NOT — the server reads API_BASE_URL at runtime and
# the browser never sees it.
#
# The values are quoted because Cloud Build splices substitutions in as raw
# text and only then parses the YAML: an org name containing ": ", "#" or a
# leading "*" would otherwise retokenize this list.
#
#   gcloud builds submit ui --config ui/cloudbuild.yaml \
#     --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/REPO/ui:TAG,_ORG_NAME="Acme Health",...
#
# Add _APP_MODE=admin (and an admin image tag) for the admin console.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - "NEXT_PUBLIC_ORG_NAME=${_ORG_NAME}"
      - --build-arg
      - "NEXT_PUBLIC_SUPPORT_EMAIL=${_SUPPORT_EMAIL}"
      - --build-arg
      - "NEXT_PUBLIC_PRIVACY_URL=${_PRIVACY_URL}"
      - --build-arg
      - "NEXT_PUBLIC_TERMS_URL=${_TERMS_URL}"
      - --build-arg
      - "NEXT_PUBLIC_LOGO_URL=${_LOGO_URL}"
      - --build-arg
      - "NEXT_PUBLIC_LOGO_WIDE_URL=${_LOGO_WIDE_URL}"
      - --build-arg
      - "APP_MODE=${_APP_MODE}"
      - -t
      - "${_IMAGE}"
      - .
images:
  - "${_IMAGE}"
substitutions:
  # nurse (service voa-ui) or admin (service voa-admin); the build refuses anything else.
  _APP_MODE: nurse
  # Optional logos; empty means the console shows its placeholder mark.
  _LOGO_URL: ""
  _LOGO_WIDE_URL: ""
options:
  # `next build` is memory-hungry; the default machine OOMs intermittently.
  machineType: E2_HIGHCPU_8
