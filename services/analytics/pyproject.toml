[project]
name = "voa-analytics"
version = "0.0.1"
description = "De-identified analytics: Firestore -> BigQuery export job and the private summary API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "voa-core",
    "google-cloud-bigquery>=3.25,<4",
    "fastapi>=0.133,<1",
    "uvicorn[standard]>=0.38,<1",
]

[tool.uv.sources]
voa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voa_analytics"]
