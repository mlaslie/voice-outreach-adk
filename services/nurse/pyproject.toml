[project]
name = "voa-nurse"
version = "0.0.1"
description = "Nurse assistant for Gemini Enterprise: ADK agent served over A2A with A2UI v0.9 cards"
requires-python = ">=3.13,<3.14"
dependencies = [
    "voa-core",
    "voa-agents",
    "google-adk>=2.12,<3",
    "google-genai>=2.31,<3",
    "google-auth>=2.40,<3",
    "requests>=2.32,<3",
    # 0.3.x on purpose: 1.x advertises protocolVersion 1.0, while Gemini
    # Enterprise's documented A2A examples are 0.3.x. [http-server] brings
    # starlette + sse-starlette, which A2AStarletteApplication needs.
    "a2a-sdk[http-server]>=0.3.25,<0.4",
    # A2UI v0.9 JSON schemas (cards are validated before they are sent).
    "a2ui-agent-sdk>=0.7,<0.8",
    "jsonschema>=4.23,<5",
    "httpx>=0.28,<1",
    "uvicorn[standard]>=0.38,<1",
]

[tool.uv.sources]
voa-core = { workspace = true }
voa-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voa_nurse"]
