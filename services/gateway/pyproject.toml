[project]
name = "voa-gateway"
version = "0.0.1"
description = "Public telephony gateway: provider webhooks + media streams <-> ADK run_live"
requires-python = ">=3.13,<3.14"
dependencies = [
    "voa-core",
    "voa-providers",
    "voa-agents",
    "fastapi>=0.133,<1",
    "uvicorn[standard]>=0.38,<1",
    "python-multipart>=0.0.20,<1",
]

[tool.uv.sources]
voa-core = { workspace = true }
voa-providers = { workspace = true }
voa-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voa_gateway"]
