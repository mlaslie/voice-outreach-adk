name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pii-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # scan history, not just the tip
      - uses: astral-sh/setup-uv@v10.3.0
      - name: PII scan (denylist from repository secret PII_DENYLIST)
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: |
          uv run --no-project python scripts/pii_scan.py --require-denylist
          uv run --no-project python scripts/pii_scan.py --require-denylist --history
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --all-packages
      - run: uv run ruff check .
      - run: uv run pytest   # live-API tests are skipped unless VOA_RUN_LIVE=1

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/demo
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.6
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false
      - run: terraform validate

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      NEXT_PUBLIC_ORG_NAME: Acme Health
      NEXT_PUBLIC_SUPPORT_EMAIL: support@example.org
      NEXT_PUBLIC_PRIVACY_URL: https://example.org/privacy
      NEXT_PUBLIC_TERMS_URL: https://example.org/terms
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc --noEmit
      - run: npm run build
