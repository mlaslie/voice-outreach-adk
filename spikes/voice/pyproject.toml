[project]
name = "voa-voice-spike"
version = "0.0.1"
description = "Phase-0 spike: telephony audio <-> ADK run_live on Gemini Live. Disposable."
requires-python = ">=3.13,<3.14"
dependencies = [
    "voa-core",
    "voa-providers",
    "voa-agents",
    "fastapi>=0.133,<1",
    "uvicorn[standard]>=0.38,<1",
]

[tool.uv.sources]
voa-core = { workspace = true }
voa-providers = { workspace = true }
voa-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_spike"]
