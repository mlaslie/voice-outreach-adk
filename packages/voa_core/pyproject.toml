[project]
name = "voa-core"
version = "0.0.1"
description = "Domain logic, config loading and logging shared by every service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.11,<3",
    "PyYAML>=6.0.2,<7",
    "google-cloud-firestore>=2.21,<3",
    "google-cloud-secret-manager>=2.24,<3",
    "google-cloud-storage>=3.0,<4",
    "google-cloud-tasks>=2.19,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voa_core"]
