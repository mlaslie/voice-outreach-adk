[project]
name = "voa-agents"
version = "0.0.1"
description = "ADK agents (voice, SMS, nurse), skills and plugins"
requires-python = ">=3.13,<3.14"
dependencies = [
    "voa-core",
    "google-adk>=2.12,<3",
    "google-genai>=2.31,<3",
]

[tool.uv.sources]
voa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voa_agents"]
