[project]
name = "voa-ehr"
version = "0.0.1"
description = "EHR export: maps signed-off results in ehr_outbox to FHIR R4 through an admin-editable profile"
requires-python = ">=3.13,<3.14"
dependencies = [
    "voa-core",
    "pydantic>=2.12.5,<3",
    "PyYAML>=6.0.2,<7",
    "httpx>=0.28,<1",
    # FHIR structure validation of what we would send (BSD-3, pure Python, ~2.3 MB,
    # depends only on pydantic v2). R4B models: identical to R4 for the resources
    # we emit. See docs/EHR-EXPORT-PLAN.md section 5.
    "fhir.resources>=8.3,<9",
]

[tool.uv.sources]
voa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voa_ehr"]
