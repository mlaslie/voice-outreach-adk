red_flags:
  es-US:
    status: draft
    review: "needs qualified translator review"
    # Mirrors intent._RED_FLAGS: chest pain, can't breathe, heavy bleeding,
    # fainting, stroke signs, clot signs, suicidal thoughts.
    negators: ["no", "nunca", "sin", "ni", "tampoco", "jamas", "niega", "niego"]
    clause_breaks: ["pero", "aunque", "sino", "excepto"]
    reach: 3
    patterns:
      # chest
      - "dolor(es)? (de|en el|en mi|del) pecho"
      - "dolor toracico"
      - "me duele (el|mi) pecho"
      - "(presion|opresion|apreton|peso) en (el|mi) pecho"
      - "pecho (apretado|oprimido)"
      - "ataque (al|del) corazon"
      - "infarto"
      # breathing
      - "no (puedo|puede|podia|pude) respirar"
      - "me (falta|faltaba) (el )?aire"
      - "falta de aire"
      - "(dificultad|problemas?) para respirar"
      - "me (cuesta|costaba) respirar"
      - "me (estoy )?ahog(o|ando)"
      - "no (esta )?respira"
      # bleeding
      - "sangr(ado|a|ando) (mucho|abundante|fuerte|sin parar|demasiado)"
      - "mucha sangre"
      - "no (para|deja) de sangrar"
      - "hemorragia"
      - "(vomit(o|ando|e)|tos(o|iendo)) sangre"
      - "sangre en (las heces|el excremento|la popo|la orina|el vomito)"
      - "heces negras"
      - "empap(a|o|ado|ada|ando) (el|la|los|las) (gasa|vendaje|venda|aposito)"
      # fainting
      - "me desmay(e|o)"
      - "se desmay(o|a)"
      - "desmayo"
      - "perd(i|io) el conocimiento"
      - "inconsciente"
      - "no (responde|reacciona) (a nada|cuando le hablo)"
      # stroke
      - "derrame( cerebral)?"
      - "embolia"
      - "accidente cerebrovascular"
      - "cara (caida|torcida|chueca|paralizada)"
      - "(arrastr(o|a|ando) las palabras|habla arrastrada|no (puedo|puede) hablar bien)"
      - "no (puedo|puede) mover (el|la|mi|los|las)"
      - "no siento (el|la|mi) (brazo|pierna|cara)"
      - "(brazo|pierna) (debil|dormid[oa]|entumecid[oa]|paralizad[oa])"
      - "(muy|de repente) confundid[oa]"
      - "(el )?peor dolor de cabeza"
      # clot
      - "pantorrilla (hinchada|inflamada|con dolor)"
      - "(dolor|hinchazon) en la pantorrilla"
      - "me duele la pantorrilla"
      - "coagulo"
      # self-harm
      - "suicid"
      - "matarme"
      - "quitarme la vida"
      - "quiero morir"
      - "no quiero vivir"
      - "hacerme dano"
      - "lastimarme"
      # emergency services
      - "ambulancia"
      - "(voy|vamos|fui) a (la sala de )?(emergencias?|urgencias)"
