# Per-language safety keywords (docs/LANGUAGES-PLAN.md §3.3, step 3).
#
# Loaded ADDITIVELY by voa_core.intent: the English lists in code always work
# and are unchanged. Every list here is a machine-drafted starting point:
#
#   status: draft  -> used anyway. Being stricter is the safe direction: an
#                     extra opt-out word or an extra emergency reply costs
#                     little; a missed one does not.
#   review: who must check it before it counts as reviewed.
#
# STOP / HELP are matched against the WHOLE message (like carriers do), after
# lower-casing, trimming punctuation and folding accents ("ALTO", "Alto.",
# "arrêt" == "arret"). Never add a word an English patient sends as an answer
# (yes, no, ok, 1, 2, 3, c, later, now, text...): tests/test_language_keywords.py
# fails on any collision.
#
# Red flags are regular expressions matched on lower-cased, accent-folded text
# ("respiración" is matched as "respiracion"), so write them WITHOUT accents.
# A match preceded, in the same clause, by one of the negators within `reach`
# words is the patient saying what they do NOT have ("no tengo dolor en el
# pecho"). Clauses split on punctuation and on the `clause_breaks` words.

status: draft
review: "needs qualified translator review"

