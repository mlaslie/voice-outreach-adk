# Non-English safety evaluation corpus (docs/LANGUAGES-PLAN.md §6, step 3).
#
# FICTIONAL content only. Each row: a patient's words in another language, the
# channel it arrives on, what kind of check it exercises, the English meaning
# (used by the offline test's FakeTranslator, and shown next to the live
# model's translation by `make eval-languages`), and the expected label.
#
#   kind          expect
#   red_flag      true (must trigger the emergency path) | false (negated)
#   unknown       unknown  ("don't know": never yes or no)
#   yes_no        yes | no
#   pain          0..10    (a number said in words)
#   dob           YYYY-MM-DD (read day first for a non-English patient)
#   question      immediate (a mixed-topic patient question)
#   swelling      urgent   (one-sided or worsening swelling)
#   stop / help   stop | help (whole-message keyword, on the original)
#
# Gates (offline CI, tests/test_language_eval.py): red-flag recall 1.0; no
# "don't know" read as yes or no; every mixed question immediate; every STOP
# word opts out. The other numbers are reported.
#
# Written by machine; needs review by a qualified translator per language.

status: draft
review: "needs qualified translator review"

rows:
