# Campaign: post-operative wellness check.
# A campaign is one kind of outreach call described as data. The voice agent's
# instruction, the SMS survey and the completeness check all read this file.
# Placeholders: {org_name}, {patient_first_name}, {patient_last_name}.
# Changing patient-facing SMS copy may require re-registering the A2P campaign.

id: post_op
name: Post-operative wellness check
agent_name: Sara

scripts:
  opener: "Hello, this is an automated call from {org_name}. May I please speak with {patient_first_name} {patient_last_name}?"
  identity_prompt: "To protect your privacy, could you please tell me your date of birth?"
  identity_verified: "Thank you, that's verified."
  consent: "I'm calling from {org_name}'s post-op care team to check on how you're doing after your recent procedure. This call may be recorded for quality. It takes about a minute. Is now a good time?"
  wrong_person: "Thank you, we'll try again another time. Goodbye."
  identity_failed: "I'm sorry, I wasn't able to verify your identity. A member of our care team will reach out. Goodbye."
  reschedule: "No problem. We'll reach out again at a better time. Goodbye."
  emergency: "That sounds serious. Please hang up now and call nine one one. I'll make sure the care team is notified."
  no_medical_advice: "I'm an automated assistant, so I can't give medical advice, but I'll make sure a nurse follows up with you."
  closing_follow_up: "Thank you. One of our nurses will be in touch with you soon. Take care, goodbye."
  closing_no_follow_up: "Thank you, that's everything. Nothing else is required from you today. Take care, goodbye."
  # No patient name or clinical detail on a voicemail: anyone may hear it.
  voicemail: "Hello, this is {org_name} calling with a follow-up message. Please call us back at your convenience at the number on your paperwork. Thank you."

# Order matters. `when` makes a question conditional on an earlier answer.
questions:
  - id: overall_feeling
    ask: "How are you feeling overall since your procedure?"
    type: text
  - id: pain_present
    ask: "Are you having any pain right now?"
    type: yes_no
  - id: pain_severity
    ask: "On a scale from zero to ten, how bad is the pain?"
    type: scale_0_10
    when: {pain_present: "yes"}
    note: "For a range, record the higher number."
  - id: pain_location
    ask: "Where is the pain?"
    type: text
    when: {pain_present: "yes"}
  - id: pain_trend
    ask: "Is it getting better, staying the same, or getting worse?"
    type: choice
    choices: [better, same, worse]
    when: {pain_present: "yes"}
  - id: fever_reported
    ask: "Have you had a fever, a temperature over one hundred point four, since you went home?"
    type: yes_no_unknown
  - id: incision_concerns
    ask: "Have you noticed anything unusual with your incision, like spreading redness, drainage, warmth, or opening?"
    type: yes_no
  - id: incision_description
    ask: "Can you describe what you see?"
    type: text
    when: {incision_concerns: "yes"}
  - id: blood_sugar_status
    ask: "Have your blood sugars been in your usual range?"
    type: choice
    choices: [in_range, high, low, unknown]
    when_patient: {is_diabetic: true}

red_flags:
  - chest pain, pressure, tightness or squeezing
  - trouble breathing or shortness of breath at rest
  - fainting or passing out
  - heavy or uncontrolled bleeding
  - coughing up or vomiting blood, or bloody stool
  - a sudden, severe ("worst ever") headache
  - "signs of stroke: face drooping, arm weakness, slurred speech"
  - calf swelling with pain
  - thoughts of harming themselves

follow_up_tiers:
  - emergency
  - urgent_same_day
  - routine_next_business_day
  - informational
  - none

outcomes:
  - questionnaire_completed
  - reschedule_requested
  - voicemail_left
  - unable_to_reach_wrong_person
  - consent_declined
  - identity_verification_failed
  - emergency_ended

custom_vocabulary: [incision, drainage, redness, Tylenol, ibuprofen, oxycodone]
